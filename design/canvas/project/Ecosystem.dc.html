<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSM Relevance Ecosystem — plate I</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div onMouseLeave="{{onLeave}}" style="position: relative; width: 720px; height: 760px; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: transparent;">

  <canvas aria-hidden="true" ref="{{setCv}}" width="1440" height="1520" style="position: absolute; left: 0; top: 0; width: 720px; height: 760px;"></canvas>

  <!-- plate caption, like an engraver's sheet -->

    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(226,174,69,0.75);">Plate I</span>
    <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 19px; color: rgba(255,255,255,0.78);">The Relevance Ecosystem</span>
  </div>

  <!-- the engines: where your customers ask -->

    <button type="button" onMouseEnter="{{e.hover}}" onFocus="{{e.hover}}" onClick="{{e.hover}}" aria-label="{{e.aria}}" style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; background: transparent; border: none; padding: 0; cursor: pointer; opacity: {{ui}};"></button>

  <!-- what we grow around you -->
  <sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
    <span aria-hidden="true" style="position: absolute; left: {{n.lx}}px; top: {{n.ly}}px; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; opacity: {{n.o}}; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{n.fg}}; padding: 3px 7px; border-radius: 4px; background: rgba(16,23,45,0.72);">{{n.name}}</span>
  </sc-for>

  <!-- annotation: the brain -->
  <div aria-hidden="true" style="position: absolute; left: 470px; top: 372px; opacity: {{ui}}; display: flex; flex-direction: column; gap: 1px; pointer-events: none;">
    <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; color: #F3E3BF;">the RSM brain</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(226,174,69,0.8);">method sealed</span>

        <span style="color: #FFFFFF; font-weight: 600;">{{r.what}}</span>
        <span style="color: #9AA8CB;">via {{r.src}}</span>
        <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7F8DB2;">{{r.ago}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

        lx: (e.x + (left ? -out : right ? out : 0)).toFixed(1), ly: (e.y + (left || right ? 0 : (edge ? 32 : (dy < 0 ? -32 : 32)))).toFixed(1),
        tx: left ? '-100%' : right ? '0' : '-50%',
        o: (ui * (foc < 0 || foc === i ? 1 : 0.45)).toFixed(2), fg: foc === i ? '#F8B10F' : 'rgba(255,255,255,0.86)',
        hover: () => { if (this.state.focus !== i) this.setState({ focus: i }); } };
    });
    const p3 = this.ease((t - 1.4) / 1.0);
    const nodes = this.N.map((n) => {
      const dx = n.x - this.cx, dy = n.y - this.cy, L = Math.hypot(dx, dy) || 1;
      return { name: n.name, lx: (n.x + dx / L * 2).toFixed(1), ly: (n.y + (dy < -20 ? -17 : 17)).toFixed(1), o: p3.toFixed(2), fg: 'rgba(243,227,191,0.85)' };
    });
    const rows = (this.rowsData || []).map((r, k) => {
      const ago = Math.max(0, Math.round((t - r.born) / 2));
      return { what: r.what, src: r.src, c: r.c, o: (1 - k * 0.28).toFixed(2), ago: ago < 1 ? 'just now' : ago + 'm ago' };
    });
    return {
      setCv: (el) => { this.ctx = el ? el.getContext('2d') : null; },
      onLeave: () => this.setState({ focus: -1 }),
      engines: engines, nodes: nodes, rows: rows, count: s.count,
      ui: ui.toFixed(3), sunO: this.ease((t - 0.1) / 0.8).toFixed(3),
      sunS: (1 + Math.sin(t * 2) * 0.01).toFixed(3), glowA: (0.18 + 0.08 * Math.sin(t * 1.6)).toFixed(2)
    };
  }
}
</script>
