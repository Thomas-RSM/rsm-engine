<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSM Search Atlas — plate I</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 720px; height: 760px; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: transparent;">

  <canvas aria-hidden="true" ref="{{setCv}}" width="1440" height="1520" style="position: absolute; left: 0; top: 0; width: 720px; height: 760px;"></canvas>

  <!-- ask on any engine -->
  <sc-for list="{{engines}}" as="e" hint-placeholder-count="8">
    <button type="button" onClick="{{e.ask}}" aria-label="{{e.aria}}" style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; background: transparent; border: none; padding: 0; cursor: pointer;"></button>
  </sc-for>

  <!-- your business: the star everything is charted around -->
  <div style="position: absolute; left: 360px; top: 322px; width: 118px; height: 118px; transform: translate(-50%, -50%) scale({{sunS}}); border-radius: 50%; background: radial-gradient(circle at 40% 34%, #FFFFFF 0%, #FFFFFF 50%, #E8EDF7 100%); box-shadow: inset 0 -8px 16px rgba(72,99,181,0.22), 0 0 0 1.5px #E2AE45, 0 0 46px rgba(248,177,15,{{glowA}}), 0 0 110px rgba(72,99,181,0.5); display: flex; align-items: center; justify-content: center; opacity: {{sunO}};">
    <img src="/_blob/f0ddc11df1deb86f300b7c52eb17b3ff" alt="" style="width: 76px; height: auto; transform: translate(2px, 1px);">
  </div>

  <!-- one question, followed all the way through -->
  <div style="position: absolute; left: 50%; top: {{card.top}}px; width: {{card.w}}px; height: {{card.h}}px; margin-left: -{{card.half}}px; box-sizing: border-box; opacity: {{ui}}; background: rgba(13,19,40,0.86); backdrop-filter: blur(14px); border: 1px solid rgba(226,174,69,0.34); border-radius: {{card.rad}}px; padding: {{card.pad}}; display: flex; flex-direction: column; justify-content: center; gap: {{card.gap}}px; box-shadow: 0 26px 54px rgba(0,0,0,0.45);">

      <span style="font-family: 'JetBrains Mono', monospace; font-size: {{card.f0}}px; letter-spacing: 0.18em; text-transform: uppercase; color: #C9B27A;">Asked on {{s.engine}}</span>
      <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: {{card.f0}}px; letter-spacing: 0.14em; text-transform: uppercase; color: #6F7CA3;">Illustration</span>

    <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: {{card.f1}}px; line-height: 1.15; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">“{{s.typed}}<span style="color: #F8B10F;">{{s.caret}}</span>”</span>

    </div>
  </div>
</div>
</x-dc>

    x.fillText('RSM · founded 2020', 714, 612);
    const kx = 44, ky = 588; x.strokeStyle = 'rgba(' + GOLD + ',0.7)'; x.lineWidth = 0.7; x.beginPath(); x.arc(kx, ky, 20, 0, 6.283); x.stroke(); x.beginPath(); x.arc(kx, ky, 15, 0, 6.283); x.stroke();
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 - Math.PI / 2, L = k % 2 ? 11 : 26; x.beginPath(); x.moveTo(kx + L * Math.cos(a), ky + L * Math.sin(a)); x.lineTo(kx + 3.2 * Math.cos(a + 1.571), ky + 3.2 * Math.sin(a + 1.571)); x.lineTo(kx + 3.2 * Math.cos(a - 1.571), ky + 3.2 * Math.sin(a - 1.571)); x.closePath(); x.fillStyle = k % 2 ? 'rgba(' + GOLD + ',0.3)' : (k === 0 ? '#F8B10F' : 'rgba(' + INK + ',0.6)'); x.fill(); x.stroke(); }
    x.textAlign = 'center'; x.font = "500 8.5px 'JetBrains Mono', monospace"; x.fillStyle = 'rgba(' + GOLD + ',0.95)'; x.fillText('YOU', kx, ky - 31);
    return c;
  }
  draw(t) {
    const ctx = this.ctx; if (!ctx || !this.plate) return;
    const cx = this.cx, cy = this.cy, st = this.state, lt = t - st.t0;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 1440, 1520);
    // the plate inks itself outward from the business
    const rev = this.ease((t - 0.2) / 2.2);
    ctx.save(); ctx.beginPath(); ctx.arc(cx * 2, cy * 2, 20 + rev * 1100, 0, 6.283); ctx.clip(); ctx.globalAlpha = Math.min(1, rev * 1.6); ctx.drawImage(this.plate, 0, 0); ctx.restore(); ctx.globalAlpha = 1;
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    // faint field stars breathe
    for (const f of this.field) { ctx.fillStyle = 'rgba(243,227,191,' + (rev * (0.12 + 0.5 * f.s * (0.5 + 0.5 * Math.sin(t * 1.2 + f.tw)))).toFixed(2) + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, 0.5 + f.s * 0.8, 0, 6.283); ctx.fill(); }
    // threads: every answered question leaves a line of gold in the chart
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    this.threads.forEach((th, i) => {
      const cur = i === 0, p = cur ? this.ease((lt - 1.5) / 1.9) : 1, n = Math.max(1, Math.floor(th.pts.length * p));
      if (cur && lt < 1.5) return;
      ctx.strokeStyle = cur ? '#F8C24A' : 'rgba(226,174,69,' + (0.34 - i * 0.06).toFixed(2) + ')'; ctx.lineWidth = cur ? 1.6 : 0.9;
      if (cur) { ctx.shadowColor = '#F8B10F'; ctx.shadowBlur = 8; }
      ctx.beginPath(); for (let k = 0; k < n; k++) { const q = th.pts[k]; k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); } ctx.stroke(); ctx.shadowBlur = 0;
      if (cur && p < 1) { const q = th.pts[n - 1]; const g = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], 10); g.addColorStop(0, 'rgba(255,240,200,1)'); g.addColorStop(1, 'rgba(248,177,15,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q[0], q[1], 10, 0, 6.283); ctx.fill(); }
    });
    const th = this.threads[0];
    if (th) {
      const e = this.E[this.stories[st.k].e];
      // the engine that was asked
      const a0 = this.ease(lt / 0.6) * (1 - this.ease((lt - 6.6) / 0.8));
      ctx.strokeStyle = 'rgba(248,177,15,' + (0.95 * a0).toFixed(2) + ')'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(e.x, e.y, 20 + 2 * Math.sin(t * 4), 0, 6.283); ctx.stroke();
      // the search it matched
      if (lt > 2.0 && lt < 7) { const k = (lt - 2.0) / 1.2, al = Math.max(0, 1 - k); ctx.strokeStyle = 'rgba(255,230,170,' + al.toFixed(2) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(th.star.x, th.star.y, 5 + 16 * k, 0, 6.283); ctx.stroke(); }
      // the business answers
      if (lt > 3.3 && lt < 5.4) { const k = (lt - 3.3) / 2.1; ctx.strokeStyle = 'rgba(248,190,90,' + (0.6 * (1 - k)).toFixed(2) + ')'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(cx, cy, 64 + 190 * this.ease(k), 0, 6.283); ctx.stroke(); }
    }
  }
  renderVals() {
    const s = this.state, t = s.t, n = s.narrow, lt = t - s.t0, st = this.stories[s.k], e = this.E[st.e];
    const typedN = Math.max(0, Math.min(st.q.length, Math.floor((lt - 0.3) * 26)));
    const ansO = this.ease((lt - 3.7) / 0.6), leadO = this.ease((lt - 4.8) / 0.5);
    const card = n
      ? { top: 596, w: 704, half: 352, h: 160, rad: 26, pad: '16px 24px', gap: 8, f0: 15, f1: 34, f2: 21, f3: 20, rowh: 40 }
      : { top: 634, w: 500, half: 250, h: 122, rad: 16, pad: '14px 20px', gap: 7, f0: 10, f1: 23, f2: 14, f3: 13, rowh: 32 };
    return {
      setCv: (el) => { this.ctx = el ? el.getContext('2d') : null; },
      engines: this.E.map((en, i) => ({ x: en.x.toFixed(1), y: en.y.toFixed(1), aria: 'Ask on ' + en.name,
        ask: () => { const k = this.stories.findIndex((q) => q.e === i); if (k < 0) return; this.newThread(k); this.setState({ k: k, t0: this.state.t }); } })),
      s: { engine: e.name, c: e.c, typed: st.q.slice(0, typedN), caret: typedN < st.q.length && Math.floor(t * 2.5) % 2 ? '|' : '',
        pre: st.pre, post: st.post, ansO: ansO.toFixed(2), lead: '+1 lead · ' + st.lead, leadO: leadO.toFixed(2), leadY: ((1 - leadO) * 6).toFixed(1) },
      card: card, ui: this.ease((t - 1.4) / 1.0).toFixed(3), sunO: this.ease(t / 0.8).toFixed(3),
      sunS: (1 + Math.sin(t * 2) * 0.01 + (lt > 3.3 && lt < 3.9 ? 0.04 * Math.sin((lt - 3.3) / 0.6 * Math.PI) : 0)).toFixed(3),
      glowA: (0.2 + 0.08 * Math.sin(t * 1.6)).toFixed(2)
    };
  }
}
