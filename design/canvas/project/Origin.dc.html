<html lang="en">
<head>
<meta charset="utf-8">
<title>RSM Origin — hero field</title>

<x-dc>
<helmet>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;display=swap">
<style>body{margin:0;background:#10172D}</style>
</helmet>

  <canvas aria-hidden="true" ref="{{setCv}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;"></canvas>

  <!-- the origin: only the logo (static styles; its light is drawn on the canvas) -->
  <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: {{c.d}}px; height: {{c.d}}px; transform: translate(-50%, -50%); z-index: 3; border-radius: 50%; background: radial-gradient(circle at 42% 34%, #FBF7EC 0%, #F6EFDF 46%, #E9DFC8 82%, #DDD1B6 100%); box-shadow: inset 0 -12px 22px rgba(120,96,44,0.20), inset 0 2px 6px rgba(255,252,240,0.55), 0 0 0 1.5px rgba(226,174,69,0.95), 0 0 0 6px rgba(12,18,38,0.55), 0 0 0 7px rgba(190,205,250,0.22), 0 0 44px rgba(248,177,15,0.38), 0 18px 40px rgba(4,8,22,0.5); display: flex; align-items: center; justify-content: center;">
    <img src="/_blob/f0ddc11df1deb86f300b7c52eb17b3ff" alt="Relevant Search Media" style="width: 66%; height: auto; transform: translate(2%, 1%);">
  </div>

  <!-- twenty platform tiles. Rendered once; each frame only moves them (transform) and fades their glow (opacity) -->
  <sc-for list="{{tiles}}" as="i" hint-placeholder-count="20">
    <div ref="{{i.ref}}" data-tile="1" style="position: absolute; left: 0; top: 0; transform: translate3d({{i.x}}px, {{i.y}}px, 0); width: {{i.s}}px; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: {{i.gap}}px; pointer-events: none; will-change: transform; backface-visibility: hidden;">

    </div>
  </sc-for>
</div>
</x-dc>
