<x-dc>
<helmet>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">

</helmet>

  <canvas aria-hidden="true" ref="{{setGl}}" style="position: absolute; left: 0; top: 0; width: 720px; height: 760px; z-index: 4; pointer-events: none;"></canvas>

  componentWillUnmount() { cancelAnimationFrame(this.raf); if (this.gl3) this.gl3.renderer.dispose(); }

    });
  }
  init3d() {

    const renderer = new T.WebGLRenderer({ canvas: this.glCanvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);

  render3d(t, s) {

  grad(a) {

  drawBg(t) {

    const breath = 0.5 + 0.5 * Math.sin(t * 0.9);
    ctx.strokeStyle = 'rgba(255,196,80,' + (0.11 + 0.05 * breath).toFixed(3) + ')'; ctx.lineWidth = 0.8;
    const tri = (sc, up, off) => { ctx.beginPath(); for (let k = 0; k < 3; k++) { const an = (up ? -Math.PI / 2 : Math.PI / 2) + k * 2.0944; const px = Math.cos(an) * sc, py = Math.sin(an) * sc + off; if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py); } ctx.closePath(); ctx.stroke(); };
    [[176, 1, 11], [150, 1, 5], [126, 1, -3], [104, 1, -7]].forEach((v) => tri(v[0], true, v[2]));
    [[172, 0, -9], [144, 0, -4], [120, 0, 3], [100, 0, 7], [80, 0, 3]].forEach((v) => tri(v[0], false, v[2]));
    ctx.restore();
    // soft breath of the core, and the one signature pulse
    const rings = this.waves.map((w) => ({ p: (t - w.t0) / 3.6, a: 0.16 }));
    if (t > 2.0 && t < 4.2) rings.push({ p: (t - 2.0) / 2.2, a: 0.5, R: 80 + (t - 2.0) * 260 });
    for (const w of rings) {
      const R = w.R || 82 + w.p * 280, al = Math.pow(1 - w.p, 2.2) * w.a;
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(248,190,90,' + al.toFixed(3) + ')';
      ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.94, 0, 0, 6.283); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    // each engine's orbit, quiet and equal; plus the ring the core terms ride
    const ui = this.ease((t - 0.6) / 1.2);
    this.items.forEach((p, i) => {
      if (p.type === 'core') return;
      const q = this.P[i];
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(163,181,242,' + (0.08 * ui).toFixed(3) + ')';
      ctx.beginPath(); ctx.ellipse(cx, cy, p.r, q.ry, q.inc, 0, 6.283); ctx.stroke();
    });
    if (!s.narrow) { ctx.strokeStyle = 'rgba(163,181,242,' + (0.16 * ui).toFixed(3) + ')'; ctx.beginPath(); ctx.ellipse(cx, cy, 172, 148, 0, 0, 6.283); ctx.stroke(); }
  }
  drawFx(t, dt) {
    const ctx = this.fx; if (!ctx) return;
    const s = this.state, cx = this.cx, cy = this.cy;
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.fillRect(0, 0, 720, 760);
    ctx.globalCompositeOperation = 'lighter';
    const inc = (-14 + s.tx * 12) * Math.PI / 180, sq = 1 + s.ty * 0.5;
    for (const d of this.dust) {
      d.a += d.sp * dt;
      const x = 300 * d.k * Math.cos(d.a), y = 96 * d.k * sq * Math.sin(d.a) + d.j * 0.3;
      const X = cx + x * Math.cos(inc) - y * Math.sin(inc), Y = cy + x * Math.sin(inc) + y * Math.cos(inc);
      const c = this.grad(d.a), dep = (Math.sin(d.a) + 1) / 2;
      if (d.px !== undefined) {
        ctx.strokeStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (0.12 + dep * 0.4).toFixed(2) + ')';
        ctx.lineWidth = d.r * (0.5 + dep * 0.7); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(d.px, d.py); ctx.lineTo(X, Y); ctx.stroke();
      }
      d.px = X; d.py = Y;
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  renderVals() {
    const s = this.state, t = s.t, n = s.narrow;
    const P = this.P || this.positions(0, s);
    const ui = this.ease((t - 0.6) / 1.2);
    const select = (i, hold) => {
      this.lastSwitch = this.state.t;
      if (this.state.sel !== i) this.waves.push({ t0: this.state.t, big: false });
      this.setState({ sel: i, manualUntil: this.state.t + hold });
    };
    // the engines, labels on their outward side, never colliding
    const planets = [];
    this.items.forEach((p, i) => {
      if (p.type !== 'planet') return;
      const q = P[i], sel = i === s.sel, dia = this.diaOf(i, q, s), half = dia / 2, left = q.X < this.cx;
      planets.push({
        i: i, sel: sel, X: q.X, Y: q.Y, depth: q.depth, left: left, dia: dia.toFixed(1), name: p.name, glyph: p.glyph, gf: Math.max(9, dia * 0.3).toFixed(1),
        label: 'Show how RSM gets you named in ' + p.name,
        x: q.X.toFixed(1), y: q.Y.toFixed(1),
        txo: left ? 'calc(-100% + ' + half.toFixed(1) + 'px)' : '-' + half.toFixed(1) + 'px',
        dir: left ? 'row-reverse' : 'row',
        z: q.depth > 0 || sel ? 5 : 1,
        o: (sel ? 1 : (0.55 + 0.45 * (q.depth + 1) / 2) * ui).toFixed(2),
        ring: sel ? 3 : 0,
        font: n ? (sel ? '700 26px Inter, sans-serif' : '500 24px Inter, sans-serif') : (sel ? '700 14px Inter, sans-serif' : '500 13px Inter, sans-serif'),
        pad: sel ? (n ? '6px 14px' : '4px 11px') : '0',
        lbg: sel ? '#F8B10F' : 'transparent', lfg: sel ? '#161E38' : 'rgba(255,255,255,0.82)',
        ld: 'inline',
        w: (n ? 13 : 7.6) * p.name.length + (sel ? 26 : 4),
        pick: () => select(i, 8),
        hover: () => { if (this.state.t - this.lastMoveT > 0.25 || this.state.sel === i) return; select(i, 6); }
      });
    });
    const placed = [];
    const chipsXY = n ? [] : this.items.slice(0, this.NC).map((c, i) => [P[i].X, P[i].Y]);
    planets.slice().sort((a, b) => (b.sel ? 9 : b.depth) - (a.sel ? 9 : a.depth)).forEach((it) => {
      if (n && !it.sel) { it.ld = 'none'; return; }
      if (!it.sel && Math.hypot(it.X - this.cx, it.Y - this.cy) < 180) { it.ld = 'none'; return; }
      const half = it.dia / 2, x0 = it.left ? it.X - half - 10 - it.w : it.X + half + 10, x1 = x0 + it.w;
      if (!it.sel && (x0 < 4 || x1 > 716)) { it.ld = 'none'; return; }
      if (placed.some((r) => x0 < r[1] + 12 && x1 > r[0] - 12 && Math.abs(r[2] - it.Y) < 26)) { it.ld = 'none'; return; }
      if (!it.sel && planets.some((o) => o !== it && x0 < o.X + o.dia / 2 + 8 && x1 > o.X - o.dia / 2 - 8 && Math.abs(o.Y - it.Y) < o.dia / 2 + 10)) { it.ld = 'none'; return; }
      if (!it.sel && chipsXY.some((c) => x0 < c[0] + 60 && x1 > c[0] - 60 && Math.abs(c[1] - it.Y) < 22)) { it.ld = 'none'; return; }
      placed.push([x0, x1, it.Y]);
    });
    planets.sort((a, b) => (a.sel ? 1 : 0) - (b.sel ? 1 : 0) || a.depth - b.depth);
    const chips = this.items.slice(0, this.NC).map((c, i) => {
      const q = P[i], sel = i === s.sel;
      const under = !sel && planets.some((o) => o.depth > -0.2 && Math.abs(o.X - q.X) < o.dia / 2 + 52 && Math.abs(o.Y - q.Y) < o.dia / 2 + 14);
      return { name: c.name, label: 'Show how RSM handles ' + c.name, x: q.X.toFixed(1), y: q.Y.toFixed(1), disp: n ? 'none' : 'block',
        z: under ? 4 : 6, o: ((under ? 0.18 : 1) * ui).toFixed(2),
        bg: sel ? '#F8B10F' : 'rgba(16,23,45,0.62)', fg: sel ? '#161E38' : 'rgba(255,255,255,0.8)', bd: sel ? '#F8B10F' : 'rgba(255,255,255,0.22)',
        pick: () => select(i, 8), hover: () => { if (this.state.t - this.lastMoveT > 0.25 || this.state.sel === i) return; select(i, 6); } };
    });
    const sp = P[s.sel], cur0 = this.items[s.sel], isCore = cur0.type === 'core';
    const dx = this.cx - sp.X, dy = this.cy - sp.Y, dl = Math.hypot(dx, dy) || 1, edge = 84;
    const cur = { name: cur0.name, kind: cur0.kind, what: cur0.what, how: cur0.how, glyph: cur0.glyph,
      icr: isCore ? '12px' : '50%',
      icbg: isCore ? 'rgba(248,177,15,0.14)' : 'radial-gradient(circle at 35% 30%, #FFFFFF 0%, ' + cur0.c + ' 40%, ' + cur0.d + ' 100%)',
      icsh: isCore ? 'inset 0 0 0 1px rgba(248,177,15,0.6)' : '0 0 16px ' + cur0.c + '88' };
    const card = n
      ? { top: 590, w: 700, half: 350, h: 160, rad: 30, pad: '22px 28px', gap: 22, ic: 70, icf: 22, lg: 6, f1: 18, f2: 30, f3: 24 }
      : { top: 590, w: 460, half: 230, h: 112, rad: 18, pad: '16px 18px', gap: 14, ic: 46, icf: 14, lg: 3, f1: 11, f2: 18, f3: 13.5 };
    return {
      setBg: (el) => { this.bg = el ? el.getContext('2d') : null; },
      setFx: (el) => { this.fx = el ? el.getContext('2d') : null; },
      setGl: (el) => { this.glCanvas = el; },
      onMove: (ev) => {
        const r = ev.currentTarget.getBoundingClientRect();
        this.lastMoveT = this.state.t; this.hovering = true;
        this.setState({ mx: ((ev.clientX - r.left) / r.width - 0.5) * 2, my: ((ev.clientY - r.top) / r.height - 0.5) * 2 });
      },
      onLeave: () => { this.hovering = false; this.setState({ mx: 0, my: 0 }); },
      flare: () => { this.waves.push({ t0: this.state.t, big: true }); },
      planets: planets, chips: chips, cur: cur, card: card, ui: ui.toFixed(3),
      ringO: n ? 0 : 1,
      haloRot: (t * -4).toFixed(2),
      beam: { x: sp.X.toFixed(1), y: sp.Y.toFixed(1), x2: (this.cx - dx / dl * edge).toFixed(1), y2: (this.cy - dy / dl * edge).toFixed(1) },
      sunS: (1 + Math.sin(t * 2.2) * 0.012).toFixed(3),
      glowA: (0.16 + 0.08 * Math.sin(t * 1.8)).toFixed(2)
    };
  }
}
</script>
</body>
