<script>
const $=id=>document.getElementById(id), cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), ease=u=>{u=cl(u);return u*u*(3-2*u)};
const ramp=(t,a,b)=>ease((t-a)/(b-a)), win=(t,a,b,f=0.5)=>Math.min(ramp(t,a,a+f),1-ramp(t,b-f,b));
const CAPS=[[0.3,5,"Sam fixes pipes better than anyone in town."],[5,10,"A customer has a leak. She doesn't ask Sam. She asks an engine."],[10,15.5,"The engines can't read him or confirm him. They name someone else."],[15.5,23,"We fix what engines read, what others confirm, what people choose."],[23,28,"Same question. Now the answer is Sam."]];
window.renderAt=function(t){
  const o=(id,v)=>$(id).setAttribute('opacity',cl(v).toFixed(3));
  // caption
  let c=CAPS.find(c=>t>=c[0]&&t<c[1]); $('cap').textContent=c?c[2]:''; const co=c?win(t,c[0],c[1],0.4):0; o('cap',co); o('capBg',co);
  // sam idle bob + arm
  const bob=Math.sin(t*2)*2; const happy=ramp(t,26,26.8);
  $('sam').setAttribute('transform','translate(452,'+(560+bob*(1-happy)-happy*8*Math.abs(Math.sin((t-26)*6)))+')');
  $('sam-armR').setAttribute('transform','rotate('+(-happy*120)+' 28 -140)');
  $('sam-face').setAttribute('d', happy>0.5?'M-10 -182 q10 12 20 0':(t<23?'M-8 -176 q8 -5 16 0':'M-8 -180 q8 6 16 0'));
  // customer
  o('cust', win(t,4.6,30,0.6)*(1-ramp(t,27.6,28.2)));
  $('drip').setAttribute('cy', 496+((t*60)%64)); $('drip').setAttribute('opacity', t<24?1-(((t*60)%64)/64):0);
  o('bubble', win(t,6,9.6,0.4)+win(t,23.3,25.2,0.4));
