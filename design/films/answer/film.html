<script>
const TL={"total": 57.88, "lines": [{"k": "a", "cap": "This is Sam. He's the best plumber in town. But his phone is quiet.", "s": 0.6, "e": 4.87}, {"k": "b", "cap": "When a customer has a leak, she doesn't call Sam. She asks Google, Maps or ChatGPT: who should I call?", "s": 5.37, "e": 12.485}, {"k": "c1", "cap": "Every engine decides the same way. It asks three things.", "s": 12.985, "e": 16.959}, {"k": "c2", "cap": "Can I read what this business does? Do other sources confirm it? Do real people choose it?", "s": 17.459, "e": 22.992}, {"k": "c3", "cap": "The three multiply. If one is zero, the answer is zero. So the engine names someone else.", "s": 23.492, "e": 29.543}, {"k": "d1", "cap": "We fix all three. Read: Sam's site now says plainly what he does, where, and for whom.", "s": 30.043, "e": 35.703}, {"k": "d2", "cap": "Confirm: listings, reviews and mentions that say the same thing.", "s": 36.203, "e": 40.265}, {"k": "d3", "cap": "Choose: a listing people pick, and calls that prove it.", "s": 40.765, "e": 44.017}, {"k": "e", "cap": "Same question. Now every engine has a reason to name Sam.", "s": 44.517, "e": 48.768}, {"k": "f", "cap": "That is the D'Souza Equation. Relevance = Read × Confirm × Choose. Be the answer.", "s": 49.268, "e": 55.981}]}; const L={}; TL.lines.forEach(l=>L[l.k]=l); window.TOTAL=TL.total;

const CH=[[A0,'1 · THE PROBLEM'],[B0,'2 · THE QUESTION'],[C0,'3 · HOW ENGINES DECIDE'],[D0,'4 · THE FIX'],[E0,'5 · THE ANSWER'],[F0,'THE EQUATION']];
